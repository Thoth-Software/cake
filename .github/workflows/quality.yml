name: Quality Gates

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "28"

permissions:
  contents: read

jobs:
  quality-fast:
    name: Compile + Credo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust (for Rustler NIFs)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Mix deps + build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - name: Cache Cargo registry + NIF target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Credo (strict)
        run: mix credo --strict

      - name: Format check
        run: mix format --check-formatted

      # Enforce module boundaries. The :boundary compiler runs in dev/prod only
      # (test code deliberately crosses boundaries), so a dev compile with
      # warnings-as-errors fails on any boundary violation. Runs before the xref
      # step so both share the one dev-env build.
      - name: Module boundaries (boundary)
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors

      # Ratchet gate against compile-time coupling creep. Run in the dev env so
      # it measures only the application graph (excludes the Mox mocks in
      # test/support, which structurally compile-depend on their behaviours).
      # Baseline is the current count (3, from Cake.Conversation.State's
      # defstruct DI defaults); ratchet it down to 0 once that is decoupled — #208.
      - name: Compile-time coupling ratchet (xref)
        env:
          MIX_ENV: dev
        run: mix xref graph --label compile-connected --fail-above 3

      # Documentation gate: fails on broken @moduledoc/@doc references. ex_doc
      # is a :dev dependency, so this runs in the dev env — reusing the dev
      # build from the steps above.
      - name: Docs (warnings as errors)
        env:
          MIX_ENV: dev
        run: mix docs --warnings-as-errors

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache Mix deps + build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # Blocking: fails when mix.lock carries entries no longer required by the
      # dependency tree.
      - name: Unused dependency check
        run: mix deps.unlock --check-unused

      # Blocking: static security analysis of the Phoenix app. The baseline is
      # clean; triaged false-positives are suppressed in .sobelow-conf and via
      # inline `# sobelow_skip` annotations, so this fails only on new findings.
      - name: Sobelow (static security analysis)
        run: mix sobelow --config --exit

      # Report-only: surfaces retired/vulnerable Hex packages without failing
      # the build. There is a pre-existing advisory backlog (see #206); this
      # becomes a blocking gate once that backlog is cleared upstream.
      - name: Hex audit (report-only)
        run: mix hex.audit
        continue-on-error: true

      # Report-only: checks deps against the mix_audit advisory database.
      # Blocked by the same backlog (#206); becomes a blocking gate — with the
      # single unfixable advisory ignored — once that backlog is remediated.
      - name: Dependency audit (report-only)
        run: mix deps.audit
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust (for Rustler NIFs)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Mix deps + build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - name: Cache Cargo registry + NIF target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests with coverage (excluding integration)
        run: mix coveralls.json --exclude integration --warnings-as-errors

  integration:
    name: Integration Tests (merge gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    env:
      # The service containers publish 9200 and 9000 on the runner host; the
      # integration case templates read these to reach them (defaults are the
      # same values, set explicitly so the wiring is visible here).
      OPENSEARCH_URL: http://localhost:9200
      S3_ENDPOINT_URL: http://localhost:9000

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Real OpenSearch for the backend conformance suite (#245). Mirrors the
      # `opensearch` service in docker-compose.yml: single node, security
      # plugin disabled (plain HTTP, no credentials), bounded heap. The demo
      # security config is skipped explicitly so the image entrypoint does not
      # demand OPENSEARCH_INITIAL_ADMIN_PASSWORD (the compose file satisfies
      # that check with a real password instead). The image is pinned rather
      # than `latest` so a vendor release cannot turn the merge gate red on
      # its own; bump it deliberately. The health check polls the root
      # endpoint the same way the compose file does, so the job's steps only
      # start once the node answers HTTP.
      opensearch:
        image: opensearchproject/opensearch:3.2.0
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --ulimit memlock=-1:-1
          --ulimit nofile=65536:65536

      # S3-compatible object store for the Cake.Books.Adapters.S3 suite (#251):
      # moto's standalone server, speaking the real S3 HTTP API on one port.
      # The issue named MinIO or LocalStack; neither is runnable here any
      # more — MinIO has withdrawn its community images (Docker Hub and
      # quay.io deny `minio/minio`, dl.min.io answers 410 Gone) and
      # LocalStack's 2026.x images exit at start-up without a paid
      # LOCALSTACK_AUTH_TOKEN (4.9.2, from October 2025, was the last free
      # release). moto is maintained, Apache-2.0, ~200 MB and up in seconds.
      # It accepts any key pair; the case template (Cake.S3IntegrationCase)
      # sends a fixed one, the test-time stand-in for the IAM-role credentials
      # the adapter assumes in production. Listens on 9000 (MOTO_PORT) rather
      # than its default 5000, which macOS reserves for AirPlay. Pinned like
      # OpenSearch above so a vendor release cannot turn the gate red on its
      # own; bump it deliberately. The health check polls moto's own API
      # endpoint, so the job's steps only start once the server answers.
      moto:
        image: motoserver/moto:5.2.3
        env:
          MOTO_PORT: "9000"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/moto-api/ || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust (for Rustler NIFs)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Mix deps + build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - name: Cache Cargo registry + NIF target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run integration tests
        run: mix test --only integration

  llm:
    name: Live LLM Tests (merge gate, internal PRs)
    runs-on: ubuntu-latest
    # Real OpenAI calls (#247): secret-bearing, cost-bearing, rate-limit-
    # flaky, so they are their own job rather than part of `integration`.
    # Fork PRs never receive repository secrets, so the job runs only when
    # the PR's head lives in this repository. That is a hard `if`, not a
    # soft-fail on a missing key: on an internal PR a missing or broken
    # OPENAI_KEY turns the gate red (Cake.LiveLLMCase fails loudly), while
    # on a fork PR the job is skipped, which a required status check
    # counts as satisfied. Register `Live LLM Tests (merge gate, internal
    # PRs)` as its own required check.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    env:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}

    # The `test` alias runs ecto.create/ecto.migrate before ExUnit, so the
    # job needs Postgres even though no :llm test touches the database.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust (for Rustler NIFs)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Mix deps + build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - name: Cache Cargo registry + NIF target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run live LLM tests
        run: mix test --only llm

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Rust (for Rustler NIFs)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Mix deps + build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - name: Cache Cargo registry + NIF target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache PLTs
        id: plt_cache
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plts-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plts-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Build PLTs if cache miss
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p priv/plts
          mix dialyzer --plt

      - name: Dialyzer
        run: mix dialyzer --format github
